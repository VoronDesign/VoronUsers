- CAD/Printed_tophat_exhaust v5.3mf
- CAD/Printed_tophat_exhaust v5.f3z
- CAD/Printed_tophat_exhaust v6.step
# The parts of your mod, exported and oriented ready to be sliced. Please provide them as a list.
